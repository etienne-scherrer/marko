name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      # Redis integration suites (packages/cache-redis, packages/ratelimiter)
      # skip without a server; this keeps them running on every build.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sockets
          coverage: none
          ini-values: memory_limit=2G

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # Excludes integration-destructive: that group deletes vendor/ and composer.lock,
      # runs `composer update`, and re-runs the whole suite in a subprocess. It verifies
      # install integrity rather than application behaviour, so it runs on the nightly
      # schedule below and is enforced again by bin/release.sh before any tag is cut.
      - name: Run test suite
        run: composer test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sockets
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs --standard=phpcs.xml

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php --dry-run --diff

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sockets
          coverage: none
          ini-values: memory_limit=2G

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHPStan
        run: composer phpstan

  # Boots the fixture app in tests/Integration/App against real Postgres and
  # Redis (the integration-services group). MARKO_INTEGRATION_REQUIRED turns
  # "services unreachable" into a failure, so this job can never pass by
  # skipping every case.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marko
          POSTGRES_PASSWORD: marko
          POSTGRES_DB: marko_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marko -d marko_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: marko
      DB_PASSWORD: marko
      DB_DATABASE: marko_integration
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MARKO_INTEGRATION_REQUIRED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sockets, pdo_pgsql
          coverage: none
          ini-values: memory_limit=2G

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run integration suite
        run: composer test:integration
