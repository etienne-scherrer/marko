# Services for the `integration-services` test group (see .claude/testing.md).
#
#   docker compose -f tests/Integration/compose.yml up -d --wait
#   DB_HOST=127.0.0.1 REDIS_HOST=127.0.0.1 \
#   MARKO_TEST_PGSQL_HOST=127.0.0.1 MARKO_TEST_PGSQL_USERNAME=marko MARKO_TEST_PGSQL_PASSWORD=marko \
#   MARKO_TEST_MYSQL_HOST=127.0.0.1 MARKO_TEST_MYSQL_PASSWORD=marko \
#   composer test:integration
#
# MariaDB is optional (the `mariadb` profile starts 11.8 on 3307 and 10.11 on
# 3308). CI runs the database-mysql driver tests against both as well; to do
# the same locally (use port 3308 for 10.11):
#
#   docker compose -f tests/Integration/compose.yml --profile mariadb up -d --wait
#   MARKO_TEST_MYSQL_HOST=127.0.0.1 MARKO_TEST_MYSQL_PORT=3307 MARKO_TEST_MYSQL_PASSWORD=marko \
#   MARKO_TEST_MYSQL_SERVER=mariadb \
#   ./vendor/bin/pest -c phpunit.xml --group=integration-services packages/database-mysql/tests/Integration
#
# If port 5432, 6379, 3306, 3307 or 3308 is already taken locally, start with
# DB_PORT=55432, REDIS_PORT=56379, MYSQL_PORT=53306, MARIADB_PORT=53307 and/or
# MARIADB_10_11_PORT=53308,
# and export the same ports when running the suite (MARKO_TEST_PGSQL_PORT and
# MARKO_TEST_MYSQL_PORT for the driver tests).
name: marko-integration

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: marko
      POSTGRES_PASSWORD: marko
      POSTGRES_DB: marko_integration
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Creates marko_test for the database-pgsql driver tests. The fixture
      # suite drops and recreates marko_integration before every case, so the
      # driver tests must not share it.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marko -d marko_integration"]
      interval: 2s
      timeout: 5s
      retries: 15

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: marko
      MYSQL_DATABASE: marko_test
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmarko"]
      interval: 2s
      timeout: 5s
      retries: 30

  mariadb:
    image: mariadb:11.8
    profiles: ["mariadb"]
    environment:
      MARIADB_ROOT_PASSWORD: marko
      MARIADB_DATABASE: marko_test
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  mariadb-10-11:
    image: mariadb:10.11
    profiles: ["mariadb"]
    environment:
      MARIADB_ROOT_PASSWORD: marko
      MARIADB_DATABASE: marko_test
    ports:
      - "${MARIADB_10_11_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
